<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Prompter</title>
    <style>
      :root { --bg-opacity: 0.4; --font-weight: 600; --font-size: 32px; --margin: 48px; --bar-h: 34px; --foot-h: 30px; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: rgba(15, 23, 42, var(--bg-opacity));
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }

      /* Top bar: the only drag region (a drag region swallows wheel and click
         events on Windows, so the text itself must stay out of it). */
      .bar {
        position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h); z-index: 20;
        display: flex; align-items: center; gap: 8px; padding: 0 8px; box-sizing: border-box;
        background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        -webkit-app-region: drag; cursor: move; font-size: 12px;
      }
      .bar button, .bar .badge, .bar .status { -webkit-app-region: no-drag; }
      .bar .spacer { flex: 1; }
      .badge {
        padding: 2px 8px; border-radius: 4px; font-weight: 700; letter-spacing: 0.05em;
        background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3);
      }
      body.paused .badge { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }
      .status { color: #fbbf24; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      button {
        font: inherit; color: #e2e8f0; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px; padding: 3px 10px; cursor: pointer;
      }
      button:hover { background: #334155; }
      #pauseBtn { background: #0891b2; color: #fff; min-width: 64px; }
      body.paused #pauseBtn { background: #f59e0b; color: #0f172a; font-weight: 700; }

      /* Top padding = reading line height (1/3), so the first word can sit on
         the reading line; otherwise the opening lines start above it and read
         as already passed. Bottom padding lets the last line reach it too. */
      #view {
        position: relative; height: 100vh; overflow-y: auto; box-sizing: border-box;
        padding: 33.333vh var(--margin) 66.667vh;
      }
      .words { font-size: var(--font-size); font-weight: var(--font-weight); line-height: 1.6; }
      .words span { cursor: pointer; border-radius: 4px; transition: opacity 120ms, background 120ms; }
      .words span:hover { background: rgba(34, 211, 238, 0.2); }
      .words span.read { opacity: 0.35; }
      .words span.active { color: #67e8f9; text-decoration: underline; text-underline-offset: 4px; }
      .words span.highlight { background: rgba(245, 158, 11, 0.25); }

      /* Reading line guide at 1/3 of the window, where the active word sits. */
      .reading-line {
        position: fixed; left: 0; right: 0; top: 33.333%; height: 1px; z-index: 10;
        pointer-events: none; background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.45), transparent);
      }

      .foot {
        position: fixed; bottom: 0; left: 0; right: 0; height: var(--foot-h); z-index: 20;
        display: flex; align-items: center; gap: 10px; padding: 0 10px; box-sizing: border-box;
        background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 11px; color: #94a3b8; font-family: ui-monospace, monospace;
      }
      #seek { flex: 1; accent-color: #06b6d4; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="bar controls">
      <span class="badge">AKTIF</span>
      <span class="status"></span>
      <span class="spacer"></span>
      <button id="prevBtn" title="Mundur satu kalimat (Ctrl+Shift+←)">◀</button>
      <button id="pauseBtn" title="Jeda / lanjut (Ctrl+Shift+Space)">Jeda</button>
      <button id="nextBtn" title="Maju satu kalimat (Ctrl+Shift+→)">▶</button>
    </div>
    <div id="view"><div class="words"></div></div>
    <div class="reading-line"></div>
    <div class="foot controls">
      <span id="progress">0 / 0 kata (0%)</span>
      <input id="seek" type="range" min="0" max="0" value="0" title="Geser untuk maju/mundur" />
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
